services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: synapse
      POSTGRES_PASSWORD: synapse
      POSTGRES_DB: synapse
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  # S3-compatible object store for STORAGE_DRIVER=s3 (Apache-2.0). MinIO no longer publishes images on Docker Hub.
  s3:
    image: rustfs/rustfs:1.0.6
    environment:
      RUSTFS_ACCESS_KEY: synapse
      RUSTFS_SECRET_KEY: synapse-dev-only
    ports: ["9000:9000", "9001:9001"]
    volumes: [s3data:/data]
volumes:
  pgdata:
  s3data:
